<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthHub</title>
  </head>
  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- Your React entrypoint -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google Translate Script loader -->
    <script type="text/javascript">
      // We only define the callback here
      window.googleTranslateElementInit = function () {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: "en",        // default language
            includedLanguages: "en,hi", // allow English + Hindi
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          "google_translate_element"   // matches div inside Header.jsx
        );
      };
    </script>
    <script id="google-translate-script" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
  </body>
</html>
